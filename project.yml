name: Defly

options:
  bundleIdPrefix: com.mapleyf
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  DeflyCore:
    type: framework
    platform: macOS
    sources:
      - Sources/DeflyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mapleyf.DeflyCore
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  Defly:
    type: application
    platform: macOS
    sources:
      - Sources/DeflyApp
    dependencies:
      - target: DeflyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mapleyf.Defly
        PRODUCT_NAME: Defly
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Defly
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  DeflyCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DeflyCoreTests
    dependencies:
      - target: DeflyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mapleyf.DeflyCoreTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  DeflyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/DeflyUITests
    dependencies:
      - target: Defly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mapleyf.DeflyUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DeflyCore:
    build:
      targets:
        DeflyCore: all
    test:
      targets:
        - DeflyCoreTests

  Defly:
    build:
      targets:
        Defly: all
    test:
      targets:
        - DeflyCoreTests
        - DeflyUITests
